<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spelling extra</title>
  <link rel="stylesheet" href="baeren.css">
  <style>
    .words { display: grid; gap: 8px; }
    .word-row { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 12px; padding: 10px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .word-row .n { font-weight: 800; width: 2.2rem; font-size: 1.3rem; color: #1b3a4b; }
    .word-row .label { flex: 1; font-size: 1.35rem; font-weight: 700; }
    .word-row button { background: #d9e4ee; color: #1c2430; }
    .word-row.heard { background: #e7f6ec; }
    .preview-wrap { background: #fff; border-radius: 12px; padding: 12px; margin-top: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .preview-wrap img { width: 100%; border-radius: 8px; }
    #photoBtn, #sendBtn { background: #1b3a4b; color: #fff; }
    #sendBtn:disabled { opacity: .45; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <header class="top">
    <a href="map.html?map=required">Back</a>
    <h1 id="title">Spelling extra</h1>
    <span id="profileLabel" class="profile-label"></span>
    <span id="score"></span>
  </header>
  <main class="quiz">
    <p id="prompt" class="prompt">Write each missed word three times. Listen to the first word three times, then the next. After the last one, take a photo of the whole page.</p>
    <div id="words" class="words"></div>
    <div class="row" style="margin-top:12px">
      <button type="button" id="photoBtn" hidden>Take photo</button>
      <button type="button" id="sendBtn" hidden disabled>Send</button>
    </div>
    <div id="previewWrap" class="preview-wrap" hidden>
      <img id="preview" alt="Your rewritten spelling list">
    </div>
    <p id="msg" class="msg"></p>
  </main>
  <input type="file" id="cameraInput" accept="image/*" capture="environment">
  <script src="baeren.js"></script>
  <script src="spellmode.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const title = params.get("title") || "Spelling extra";
    const lang = (params.get("lang") || "eng").toLowerCase() === "fr" ? "fr" : "eng";
    const gameName = lang === "fr" ? "FrSpellingOCRXtra" : "EngSpellingOCRXtra";
    const locale = lang === "fr" ? "fr-FR" : "en-US";
    const label = lang === "fr" ? "French" : "English";
    document.getElementById("title").textContent = title;
    if (window.SpellMode && SpellMode.get(lang) === "screen") {
      location.replace("xtra-screen.html" + location.search);
    } else if (window.SpellMode) {
      SpellMode.set(lang, "paper");
    }

    let words = [];
    let step = 0;
    let speaking = false;
    let busy = false;
    let photo = null;

    function torontoYmd() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Toronto",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
    }

    function totalSteps() {
      return words.length * 3;
    }

    function activeIndex() {
      if (!words.length || step >= totalSteps()) return words.length;
      return Math.floor(step / 3);
    }

    function copiesDone(i) {
      return Math.max(0, Math.min(3, step - i * 3));
    }

    function render() {
      const done = step >= totalSteps() && words.length > 0;
      document.getElementById("score").textContent = words.length ? (Math.min(step, totalSteps()) + " / " + totalSteps()) : "";
      const photoBtn = document.getElementById("photoBtn");
      const sendBtn = document.getElementById("sendBtn");
      photoBtn.hidden = !done;
      photoBtn.disabled = busy || speaking;
      sendBtn.hidden = !photo;
      sendBtn.disabled = busy || speaking || !photo;
      document.getElementById("words").querySelectorAll(".word-row").forEach(function (row, i) {
        const heard = copiesDone(i);
        row.classList.toggle("heard", heard === 3);
        const note = row.querySelector(".note");
        note.textContent = heard === 3 ? "Written 3 times" : "Write 3 times · " + heard + " of 3";
        const btn = row.querySelector("button");
        btn.disabled = busy || speaking || i > activeIndex();
        btn.textContent = heard === 3 ? "Hear again" : "Hear";
      });
    }

    function playAt(i) {
      if (busy || speaking || i > activeIndex() || !words[i]) return;
      speaking = true;
      render();
      Baeren.speak("Spell: " + words[i].word, locale, 0.75, function () {
        speaking = false;
        if (i === activeIndex() && step < totalSteps()) step++;
        render();
      });
    }

    function showWords() {
      const box = document.getElementById("words");
      box.innerHTML = "";
      words.forEach(function (item, i) {
        const row = document.createElement("div");
        row.className = "word-row";
        const num = document.createElement("div");
        num.className = "n";
        num.textContent = (i + 1) + ".";
        const text = document.createElement("div");
        text.className = "label";
        const name = document.createElement("div");
        name.textContent = item.word;
        const note = document.createElement("div");
        note.className = "note";
        note.style.fontWeight = "600";
        note.style.fontSize = "0.95rem";
        text.appendChild(name);
        text.appendChild(note);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "Hear";
        btn.addEventListener("click", function () { playAt(i); });
        row.appendChild(num);
        row.appendChild(text);
        row.appendChild(btn);
        box.appendChild(row);
      });
      render();
    }

    function compressPhoto(dataUrl) {
      return new Promise(function (resolve, reject) {
        const img = new Image();
        img.onload = function () {
          const max = 1600;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        };
        img.onerror = function () { reject(new Error("Could not read that photo.")); };
        img.src = dataUrl;
      });
    }

    document.getElementById("photoBtn").addEventListener("click", function () {
      if (busy || step < totalSteps()) return;
      document.getElementById("cameraInput").click();
    });

    document.getElementById("cameraInput").addEventListener("change", function (event) {
      const fileInput = event.target.files && event.target.files[0];
      if (!fileInput) return;
      const reader = new FileReader();
      reader.onload = function () {
        photo = reader.result;
        document.getElementById("preview").src = photo;
        document.getElementById("previewWrap").hidden = false;
        document.getElementById("msg").textContent = "";
        render();
      };
      reader.readAsDataURL(fileInput);
    });

    document.getElementById("sendBtn").addEventListener("click", async function () {
      if (busy || speaking || !photo || step < totalSteps() || !words.length) return;
      if (!Baeren.hasDb()) {
        document.getElementById("msg").textContent = "Supabase is not configured in this browser.";
        return;
      }
      busy = true;
      render();
      document.getElementById("msg").textContent = "Saving…";
      try {
        const profile = Baeren.cfg().profile;
        const day = torontoYmd();
        const round = String(words[0].round || 1).padStart(2, "0");
        const joined = words.map(function (item) {
          return String(item.word || "").replace(/\|/g, "").trim();
        }).filter(Boolean).join("|");
        const task = gameName + "-" + day + "-r" + round + "-sheet-" + joined + "-unverified";
        const pattern = gameName + "-" + day + "-r" + round + "-sheet-%";
        try { await Baeren.rpc("af_cleanup_old_chore_videos", { p_days: 7 }); } catch (e) { console.warn(e); }
        await Baeren.rpc("af_delete_image_uploads_ilike", {
          p_profile: profile,
          p_task_pattern: pattern
        });
        const dataUrl = await compressPhoto(photo);
        await Baeren.rpc("af_upsert_image_upload", {
          p_profile: profile,
          p_task: task,
          p_image: dataUrl.slice(dataUrl.indexOf(",") + 1)
        });
        await Baeren.rpc("af_enqueue_spelling_xtra_review", {
          p_profile: profile,
          p_language: lang,
          p_date: day,
          p_expected_count: 1
        });
        document.getElementById("msg").textContent = "Checking your copies…";
        setTimeout(function () { location.href = "map.html?map=required"; }, 700);
      } catch (err) {
        busy = false;
        render();
        document.getElementById("msg").textContent = err.message || String(err);
      }
    });

    function lockedMessage(status) {
      if (status && status.message) return status.message;
      if (!status || status.phase === "need_ocr") return "Complete " + label + " Spelling OCR first.";
      return "Your spelling is still being checked. Try again in a minute.";
    }

    (async function () {
      if (window.SpellMode && SpellMode.get(lang) === "screen") return;
      try {
        if (!Baeren.hasDb()) throw new Error("Supabase is not configured in this browser.");
        const status = await Baeren.rpc("af_get_spelling_xtra_status", {
          p_profile: Baeren.cfg().profile,
          p_language: lang,
          p_date: torontoYmd()
        });
        if (!status || status.phase !== "practice") {
          document.getElementById("prompt").textContent = "";
          document.getElementById("msg").textContent = lockedMessage(status);
          return;
        }
        words = (status.words || []).filter(function (item) { return item && item.word; });
        if (!words.length) {
          document.getElementById("prompt").textContent = "";
          document.getElementById("msg").textContent = "Nothing to copy right now.";
          return;
        }
        showWords();
      } catch (err) {
        document.getElementById("prompt").textContent = "";
        document.getElementById("msg").textContent = err.message || String(err);
      }
    })();
  </script>
</body>
</html>
