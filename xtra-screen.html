<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spelling extra</title>
  <link rel="stylesheet" href="baeren.css">
  <style>
    .paper { background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .sheet { position: relative; background: #fff; }
    canvas { display: block; position: relative; z-index: 1; width: 100%; height: 240px; touch-action: none; background: transparent; border: 2px dashed #c5d0dc; border-radius: 8px; cursor: crosshair; }
    canvas.erasing { cursor: cell; }
    .guides {
      position: absolute;
      z-index: 0;
      inset: 2px;
      border-radius: 6px;
      pointer-events: none;
      background-image:
        linear-gradient(#ff69b4, #ff69b4),
        linear-gradient(#87ceeb, #87ceeb),
        linear-gradient(#87ceeb, #87ceeb),
        linear-gradient(#ff69b4, #ff69b4);
      background-repeat: no-repeat;
      background-size: 100% 3px;
      background-position: left 20%, left 40%, left 60%, left 80%;
    }
    #clearBtn { background: #d9e4ee; color: #1c2430; }
    #clearBtn.on { background: #1b3a4b; color: #fff; }
    #doneBtn { background: #1b3a4b; color: #fff; }
    #doneBtn:disabled { opacity: .45; }
  </style>
</head>
<body>
  <header class="top">
    <a href="map.html?map=required">Back</a>
    <h1 id="title">Spelling extra</h1>
    <span id="profileLabel" class="profile-label"></span>
    <span id="score"></span>
  </header>
  <main class="quiz">
    <p id="word" class="shown-word"></p>
    <p id="prompt" class="prompt"></p>
    <div class="paper"><div class="sheet"><div class="guides" aria-hidden="true"></div><canvas id="paper" width="900" height="360"></canvas></div></div>
    <div class="row" style="margin-top:12px">
      <button type="button" id="clearBtn" aria-pressed="false">Erase</button>
      <button type="button" id="hearBtn">Hear again</button>
      <button type="button" id="doneBtn" disabled>Done</button>
    </div>
    <p id="msg" class="msg"></p>
  </main>
  <script src="baeren.js"></script>
  <script src="spellmode.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const title = params.get("title") || "Spelling extra";
    const lang = (params.get("lang") || "eng").toLowerCase() === "fr" ? "fr" : "eng";
    const gameName = lang === "fr" ? "FrSpellingOCRXtra" : "EngSpellingOCRXtra";
    const locale = lang === "fr" ? "fr-FR" : "en-US";
    const label = lang === "fr" ? "French" : "English";
    document.getElementById("title").textContent = title;
    if (window.SpellMode && SpellMode.get(lang) === "paper") {
      location.replace("xtra.html" + location.search);
    } else if (window.SpellMode) {
      SpellMode.set(lang, "screen");
    }

    const canvas = document.getElementById("paper");
    const ctx = canvas.getContext("2d");
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#1c2430";

    let queue = [];
    let index = 0;
    let drawing = false;
    let erasing = false;
    let eraseFrom = null;
    let dirty = false;
    let busy = false;
    let expected = 0;
    const ERASE_RADIUS = 28;

    function torontoYmd() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Toronto",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
    }

    function setErasing(on) {
      erasing = on;
      const btn = document.getElementById("clearBtn");
      btn.classList.toggle("on", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      btn.textContent = on ? "Write" : "Erase";
      canvas.classList.toggle("erasing", on);
    }

    function fillPaper() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      dirty = false;
      document.getElementById("doneBtn").disabled = true;
      setErasing(false);
    }

    function eraseDot(p) {
      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(p.x, p.y, ERASE_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function eraseStroke(to) {
      const from = eraseFrom || to;
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const dist = Math.hypot(dx, dy);
      const step = ERASE_RADIUS * 0.45;
      const n = Math.max(1, Math.ceil(dist / step));
      for (let i = 1; i <= n; i++) {
        eraseDot({ x: from.x + dx * i / n, y: from.y + dy * i / n });
      }
      eraseFrom = to;
    }

    function speakCurrent() {
      const item = queue[index];
      if (!item) return;
      Baeren.speak("Spell: " + item.word, locale, 0.75);
    }

    function showSlot() {
      const item = queue[index];
      document.getElementById("word").textContent = item.word;
      document.getElementById("prompt").textContent = "Write this word on the screen. Copy " + item.n + " of 3.";
      document.getElementById("score").textContent = (index + 1) + " / " + queue.length;
      document.getElementById("msg").textContent = "";
      fillPaper();
      speakCurrent();
    }

    function point(event) {
      const src = event.touches ? event.touches[0] : event;
      const box = canvas.getBoundingClientRect();
      return {
        x: (src.clientX - box.left) * canvas.width / box.width,
        y: (src.clientY - box.top) * canvas.height / box.height
      };
    }

    function startDraw(event) {
      if (busy) return;
      event.preventDefault();
      drawing = true;
      const p = point(event);
      if (erasing) {
        eraseFrom = null;
        eraseStroke(p);
        return;
      }
      ctx.globalCompositeOperation = "source-over";
      ctx.strokeStyle = "#1c2430";
      ctx.fillStyle = "#1c2430";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      // A tap with no movement has no line to stroke, so stamp a dot the pen width.
      ctx.beginPath();
      ctx.arc(p.x, p.y, ctx.lineWidth / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      dirty = true;
      document.getElementById("doneBtn").disabled = false;
    }

    function moveDraw(event) {
      if (!drawing) return;
      event.preventDefault();
      const p = point(event);
      if (erasing) {
        eraseStroke(p);
        return;
      }
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      dirty = true;
      document.getElementById("doneBtn").disabled = false;
    }

    function endDraw() {
      drawing = false;
      eraseFrom = null;
    }

    canvas.addEventListener("mousedown", startDraw);
    canvas.addEventListener("mousemove", moveDraw);
    window.addEventListener("mouseup", endDraw);
    canvas.addEventListener("touchstart", startDraw, { passive: false });
    canvas.addEventListener("touchmove", moveDraw, { passive: false });
    canvas.addEventListener("touchend", endDraw);

    async function saveDrawing(item) {
      const profile = Baeren.cfg().profile;
      const day = torontoYmd();
      const round = String(item.round).padStart(2, "0");
      const num = String(item.n).padStart(2, "0");
      const task = gameName + "-" + day + "-r" + round + "-" + num + "-" + item.word + "-unverified";
      const pattern = gameName + "-" + day + "-r" + round + "-" + num + "-" + item.word + "-%";
      try { await Baeren.rpc("af_cleanup_old_chore_videos", { p_days: 7 }); } catch (e) { console.warn(e); }
      const existing = await Baeren.rpc("af_get_image_upload_id", {
        p_profile: profile,
        p_task_pattern: pattern
      });
      if (existing) await Baeren.rpc("af_delete_image_upload_by_id", { p_id: existing });
      const flat = document.createElement("canvas");
      flat.width = canvas.width;
      flat.height = canvas.height;
      const flatCtx = flat.getContext("2d");
      flatCtx.fillStyle = "#fff";
      flatCtx.fillRect(0, 0, flat.width, flat.height);
      flatCtx.drawImage(canvas, 0, 0);
      const dataUrl = flat.toDataURL("image/png");
      await Baeren.rpc("af_upsert_image_upload", {
        p_profile: profile,
        p_task: task,
        p_image: dataUrl.slice(dataUrl.indexOf(",") + 1)
      });
    }

    async function finish() {
      document.getElementById("word").textContent = "";
      document.getElementById("prompt").textContent = "";
      document.getElementById("msg").textContent = "Sending for review…";
      if (expected > 0) {
        await Baeren.rpc("af_enqueue_spelling_xtra_review", {
          p_profile: Baeren.cfg().profile,
          p_language: lang,
          p_date: torontoYmd(),
          p_expected_count: expected
        });
      }
      document.getElementById("msg").textContent = "Checking your copies…";
      setTimeout(function () { location.href = "map.html?map=required"; }, 700);
    }

    document.getElementById("clearBtn").addEventListener("click", function () {
      if (!busy) setErasing(!erasing);
    });
    document.getElementById("hearBtn").addEventListener("click", speakCurrent);
    document.getElementById("doneBtn").addEventListener("click", async function () {
      if (busy || !dirty || !queue[index]) return;
      if (!Baeren.hasDb()) {
        document.getElementById("msg").textContent = "Supabase is not configured in this browser.";
        return;
      }
      busy = true;
      document.getElementById("doneBtn").disabled = true;
      document.getElementById("msg").textContent = "Saving…";
      try {
        await saveDrawing(queue[index]);
        index++;
        if (index >= queue.length) { await finish(); return; }
        busy = false;
        showSlot();
      } catch (err) {
        busy = false;
        document.getElementById("doneBtn").disabled = !dirty;
        document.getElementById("msg").textContent = err.message || String(err);
      }
    });

    function lockedMessage(status) {
      if (status && status.message) return status.message;
      if (!status || status.phase === "need_ocr") return "Complete " + label + " Spelling OCR first.";
      return "Your spelling is still being checked. Try again in a minute.";
    }

    (async function () {
      if (window.SpellMode && SpellMode.get(lang) === "paper") return;
      try {
        if (!Baeren.hasDb()) throw new Error("Supabase is not configured in this browser.");
        const status = await Baeren.rpc("af_get_spelling_xtra_status", {
          p_profile: Baeren.cfg().profile,
          p_language: lang,
          p_date: torontoYmd()
        });
        if (!status || status.phase !== "practice") {
          document.getElementById("msg").textContent = lockedMessage(status);
          document.getElementById("hearBtn").disabled = true;
          return;
        }
        const seen = {};
        (status.words || []).forEach(function (word) {
          const copies = word.copies || [
            { n: 1, status: "missing" },
            { n: 2, status: "missing" },
            { n: 3, status: "missing" }
          ];
          copies.forEach(function (copy) {
            if (copy.status === "missing") queue.push({ word: word.word, round: word.round, n: copy.n });
          });
          if (!seen[word.round]) {
            seen[word.round] = true;
            expected += (status.words || []).filter(function (item) { return item.round === word.round; }).length * 3;
          }
        });
        if (!queue.length) {
          document.getElementById("msg").textContent = "Nothing to copy right now.";
          return;
        }
        showSlot();
      } catch (err) {
        document.getElementById("msg").textContent = err.message || String(err);
      }
    })();
  </script>
</body>
</html>
