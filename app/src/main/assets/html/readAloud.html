<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read aloud</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard', 'Arial Rounded MT Bold', sans-serif;
            background-color: #fffcf9;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .game-container {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 { color: #2e7d32; margin: 0 0 6px; }
        .progress { color: #666; font-size: 18px; margin: 0 0 12px; }
        .passage {
            font-size: 28px;
            line-height: 1.35;
            color: #1b3a4b;
            margin: 8px 0 16px;
        }
        .audio-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 8px 0 12px;
            flex-wrap: wrap;
        }
        .green-button, .record-button, .stop-button {
            font-family: inherit;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            color: white;
            padding: 14px 28px;
            font-size: 22px;
            line-height: 1.2;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }
        .green-button { background-color: #4CAF50; }
        .record-button { background-color: #ff6b6b; }
        .stop-button { background-color: #e53935; }
        .green-button:disabled, .record-button:disabled, .stop-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .hidden { display: none; }
        .recorder-panel {
            margin: 8px 0;
            padding: 16px;
            background: #fff3cd;
            border-radius: 10px;
            border: 2px solid #ffeaa7;
        }
        .timer {
            font-size: 36px;
            font-weight: bold;
            color: #c62828;
            margin: 8px 0 12px;
            font-variant-numeric: tabular-nums;
        }
        .timer.idle { color: #666; font-size: 28px; }
        .recording-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #e53935;
            margin-right: 8px;
            vertical-align: middle;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }
        audio { width: 100%; max-width: 480px; margin: 8px 0 0; }
        .message {
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }
        .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .message.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Read aloud</h1>
        <p class="progress" id="progress"></p>
        <p class="passage" id="passage"></p>
        <div class="audio-actions" id="actions">
            <button class="record-button" id="recordBtn" onclick="toggleRecord()">Record</button>
            <button class="green-button hidden" id="doneBtn" onclick="submitAudio()">Done</button>
            <button class="green-button hidden" id="againBtn" onclick="recordAgain()">Record again</button>
        </div>
        <div class="recorder-panel" id="recorderPanel">
            <div class="timer idle" id="timerDisplay">0:00</div>
            <audio id="playback" controls class="hidden"></audio>
        </div>
        <div id="messageContainer"></div>
    </div>
    <script>
        const DEFAULT_MAX_SECONDS = 90;
        let mediaRecorder = null;
        let mediaStream = null;
        let recordedChunks = [];
        let recordedBlob = null;
        let recordedDataUrl = null;
        let recordedMimeType = 'audio/webm';
        let recording = false;
        let submitting = false;
        let timerInterval = null;
        let recordStartedAt = 0;
        let elapsedMs = 0;
        let maxSeconds = DEFAULT_MAX_SECONDS;
        let language = 'en';
        let count = 2;
        let day = '';
        let passages = [];
        let index = 0;

        function readParams() {
            const params = new URLSearchParams(window.location.search);
            const lang = (params.get('lang') || 'en').trim().toLowerCase();
            language = (lang === 'fr' || lang === 'french') ? 'fr' : 'en';
            const rawCount = Number(params.get('count'));
            count = Number.isFinite(rawCount) && rawCount > 0 ? Math.floor(rawCount) : 2;
            const rawMax = Number(params.get('maxSeconds'));
            maxSeconds = Number.isFinite(rawMax) && rawMax >= 10 ? rawMax : DEFAULT_MAX_SECONDS;
        }

        function currentProfile() {
            if (window.Baeren && typeof Baeren.cfg === 'function') {
                const profile = Baeren.cfg().profile;
                if (profile) return profile;
            }
            if (window.Android && typeof window.Android.getCurrentProfile === 'function') {
                try {
                    return window.Android.getCurrentProfile() || 'AM';
                } catch (e) {}
            }
            return 'AM';
        }

        function rpc(name, body) {
            if (window.Baeren && typeof Baeren.rpc === 'function') return Baeren.rpc(name, body);
            return Promise.reject(new Error('Open Read aloud from the task list.'));
        }

        function formatMmSs(totalSeconds) {
            const s = Math.max(0, Math.floor(totalSeconds));
            const m = Math.floor(s / 60);
            const rem = s % 60;
            return m + ':' + String(rem).padStart(2, '0');
        }

        function showMessage(text, type) {
            document.getElementById('messageContainer').innerHTML =
                '<div class="message ' + (type || 'info') + '">' + text + '</div>';
        }

        function hideMessage() {
            document.getElementById('messageContainer').innerHTML = '';
        }

        function setBusy(busy) {
            submitting = busy;
            document.getElementById('recordBtn').disabled = busy;
            document.getElementById('doneBtn').disabled = busy;
        }

        function pickMimeType() {
            const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4', 'audio/aac'];
            if (typeof MediaRecorder === 'undefined' || typeof MediaRecorder.isTypeSupported !== 'function') return '';
            for (let i = 0; i < types.length; i++) {
                if (MediaRecorder.isTypeSupported(types[i])) return types[i];
            }
            return '';
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timerDisplay');
            const secs = elapsedMs / 1000;
            if (recording) {
                el.classList.remove('idle');
                el.innerHTML = '<span class="recording-dot"></span>' + formatMmSs(secs);
            } else {
                el.classList.add('idle');
                el.textContent = formatMmSs(secs);
            }
        }

        function startTimer() {
            recordStartedAt = Date.now();
            elapsedMs = 0;
            updateTimerDisplay();
            clearInterval(timerInterval);
            timerInterval = setInterval(function() {
                elapsedMs = Date.now() - recordStartedAt;
                updateTimerDisplay();
                if (elapsedMs >= maxSeconds * 1000) {
                    stopRecording();
                    showMessage('Max length reached (' + formatMmSs(maxSeconds) + '). You can submit or re-record.', 'info');
                }
            }, 200);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            if (recordStartedAt) elapsedMs = Date.now() - recordStartedAt;
            updateTimerDisplay();
        }

        function blobToDataUrl(blob) {
            return new Promise(function(resolve, reject) {
                const reader = new FileReader();
                reader.onload = function() { resolve(reader.result); };
                reader.onerror = function() { reject(reader.error || new Error('Failed to read recording')); };
                reader.readAsDataURL(blob);
            });
        }

        function dataUrlToBlob(dataUrl) {
            const parts = String(dataUrl).split(',');
            const mime = (parts[0].match(/:(.*?);/) || [])[1] || 'audio/mp4';
            const bin = atob(parts[1] || '');
            const arr = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            return new Blob([arr], { type: mime });
        }

        function resetRecorded() {
            recordedBlob = null;
            recordedDataUrl = null;
            recordedChunks = [];
            const playback = document.getElementById('playback');
            playback.pause();
            playback.removeAttribute('src');
            playback.classList.add('hidden');
            document.getElementById('doneBtn').classList.add('hidden');
            elapsedMs = 0;
            updateTimerDisplay();
        }

        function showRecordedUi() {
            const playback = document.getElementById('playback');
            if (recordedBlob) {
                playback.src = URL.createObjectURL(recordedBlob);
                playback.classList.remove('hidden');
            }
            document.getElementById('recordBtn').textContent = 'Re-record';
            document.getElementById('recordBtn').classList.remove('stop-button');
            document.getElementById('recordBtn').classList.add('record-button');
            document.getElementById('doneBtn').classList.remove('hidden');
        }

        function openWebMicrophone() {
            return navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
                video: false
            }).catch(function (err) {
                if (err && err.name === 'NotAllowedError') throw err;
                return navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            });
        }

        function useNativeAudio() {
            return !!(window.Android && typeof window.Android.startAudioRecording === 'function'
                && typeof window.Android.stopAudioRecording === 'function'
                && !window.Android.__baerenShim);
        }

        function stopMediaStream() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(function(track) { track.stop(); });
                mediaStream = null;
            }
        }

        function taskKey(passageId) {
            return 'readAloud_' + language + '_' + passageId + '_' + day;
        }

        function showPassage() {
            const passage = passages[index];
            document.getElementById('progress').textContent = 'Sentence ' + (index + 1) + ' of ' + passages.length;
            document.getElementById('passage').textContent = passage ? passage.text : '';
            document.getElementById('recordBtn').classList.remove('hidden');
            document.getElementById('againBtn').classList.add('hidden');
            document.getElementById('recorderPanel').classList.remove('hidden');
            document.getElementById('recordBtn').textContent = 'Record';
            resetRecorded();
        }

        function showDone() {
            document.getElementById('progress').textContent = 'All done for today';
            document.getElementById('passage').textContent = 'You read every sentence.';
            document.getElementById('recordBtn').classList.add('hidden');
            document.getElementById('doneBtn').classList.add('hidden');
            document.getElementById('againBtn').classList.remove('hidden');
            document.getElementById('recorderPanel').classList.add('hidden');
        }

        function recordAgain() {
            if (!passages.length) return;
            index = 0;
            showPassage();
            hideMessage();
        }

        function finishTask() {
            showMessage('Recording saved.', 'success');
            if (window.Android && typeof window.Android.gameCompleted === 'function') {
                try {
                    window.Android.gameCompleted(1, 0);
                } catch (e) {
                    setBusy(false);
                    showDone();
                    showMessage('Saved, but the task did not close: ' + e.message, 'error');
                }
                return;
            }
            setBusy(false);
            showDone();
        }

        async function startRecording() {
            if (submitting || recording || !passages[index]) return;
            hideMessage();
            showMessage('Starting microphone...', 'info');
            resetRecorded();

            if (useNativeAudio()) {
                window.__onNativeAudioStartOk = function() {
                    recording = true;
                    startTimer();
                    document.getElementById('recordBtn').textContent = 'Stop';
                    document.getElementById('recordBtn').classList.remove('record-button');
                    document.getElementById('recordBtn').classList.add('stop-button');
                    hideMessage();
                };
                window.__onNativeAudioStartErr = function(msg) {
                    recording = false;
                    stopTimer();
                    document.getElementById('recordBtn').textContent = 'Record';
                    showMessage('Could not start microphone: ' + msg, 'error');
                };
                try {
                    window.Android.startAudioRecording('__onNativeAudioStartOk', '__onNativeAudioStartErr');
                } catch (e) {
                    showMessage('Could not start microphone: ' + e.message, 'error');
                }
                return;
            }

            if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function' || typeof MediaRecorder === 'undefined') {
                showMessage('Microphone not available on this device.', 'error');
                return;
            }

            try {
                mediaStream = await openWebMicrophone();
                const mimeType = pickMimeType();
                recordedMimeType = mimeType || 'audio/webm';
                recordedChunks = [];
                mediaRecorder = mimeType
                    ? new MediaRecorder(mediaStream, { mimeType: mimeType })
                    : new MediaRecorder(mediaStream);
            } catch (e) {
                stopMediaStream();
                const detail = (e && (e.name || e.message)) ? (e.name + ': ' + e.message) : String(e);
                showMessage('Could not start microphone (' + detail + ').', 'error');
                return;
            }

            mediaRecorder.ondataavailable = function(event) {
                if (event.data && event.data.size > 0) recordedChunks.push(event.data);
            };
            mediaRecorder.onstop = async function() {
                stopMediaStream();
                recording = false;
                stopTimer();
                document.getElementById('recordBtn').textContent = 'Re-record';
                document.getElementById('recordBtn').classList.remove('stop-button');
                document.getElementById('recordBtn').classList.add('record-button');
                const type = recordedChunks[0] && recordedChunks[0].type ? recordedChunks[0].type : recordedMimeType;
                recordedBlob = new Blob(recordedChunks, { type: type || 'audio/webm' });
                if (!recordedBlob.size) {
                    showMessage('No audio captured. Please try again.', 'error');
                    return;
                }
                try {
                    recordedDataUrl = await blobToDataUrl(recordedBlob);
                    showRecordedUi();
                    hideMessage();
                } catch (err) {
                    showMessage('Could not prepare recording: ' + err.message, 'error');
                }
            };
            mediaRecorder.start(1000);
            recording = true;
            startTimer();
            document.getElementById('recordBtn').textContent = 'Stop';
            document.getElementById('recordBtn').classList.remove('record-button');
            document.getElementById('recordBtn').classList.add('stop-button');
            hideMessage();
        }

        function stopRecording() {
            if (!recording) return;
            if (useNativeAudio() && (!mediaRecorder || mediaRecorder.state === 'inactive')) {
                showMessage('Saving recording...', 'info');
                window.__onNativeAudioStopOk = function(dataUrl) {
                    recording = false;
                    stopTimer();
                    document.getElementById('recordBtn').textContent = 'Re-record';
                    document.getElementById('recordBtn').classList.remove('stop-button');
                    document.getElementById('recordBtn').classList.add('record-button');
                    recordedDataUrl = dataUrl;
                    recordedMimeType = 'audio/mp4';
                    try { recordedBlob = dataUrlToBlob(dataUrl); } catch (e) { recordedBlob = null; }
                    showRecordedUi();
                    hideMessage();
                };
                window.__onNativeAudioStopErr = function(msg) {
                    recording = false;
                    stopTimer();
                    document.getElementById('recordBtn').textContent = 'Record';
                    showMessage('Could not save recording: ' + msg, 'error');
                };
                try {
                    window.Android.stopAudioRecording('__onNativeAudioStopOk', '__onNativeAudioStopErr');
                } catch (e) {
                    recording = false;
                    stopTimer();
                    showMessage('Could not stop recording: ' + e.message, 'error');
                }
                return;
            }
            if (!mediaRecorder) return;
            try {
                if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            } catch (e) {
                recording = false;
                stopMediaStream();
                stopTimer();
            }
        }

        function toggleRecord() {
            if (submitting || !passages[index]) return;
            if (recording) stopRecording();
            else startRecording();
        }

        function submitAudio() {
            const passage = passages[index];
            if (submitting || !passage) return;
            if (!recordedDataUrl) {
                showMessage('Record the sentence first.', 'error');
                return;
            }
            if (!window.Android || typeof window.Android.uploadImageToSupabase !== 'function') {
                showMessage('Upload is not available on this page.', 'error');
                return;
            }
            setBusy(true);
            showMessage('Uploading recording...', 'info');
            try {
                window.Android.uploadImageToSupabase(JSON.stringify({
                    profile: currentProfile(),
                    task: taskKey(passage.id),
                    image: recordedDataUrl
                }), 'onUploadSuccess', 'onUploadError');
            } catch (e) {
                setBusy(false);
                showMessage('Error calling upload: ' + e.message, 'error');
            }
        }

        window.onUploadSuccess = function() {
            const passage = passages[index];
            if (passage) passage.recorded = true;
            const next = passages.findIndex(function (item) { return !item.recorded; });
            if (next >= 0) {
                index = next;
                setBusy(false);
                showPassage();
                showMessage('Saved. Read the next sentence.', 'success');
                return;
            }
            showMessage('Sending for review…', 'info');
            rpc('af_enqueue_reading_audio_review', {
                p_profile: currentProfile(),
                p_language: language,
                p_date: day
            }).catch(function (err) {
                console.warn(err);
            }).then(function () {
                finishTask();
            });
        };

        window.onUploadError = function(error) {
            setBusy(false);
            showMessage('Could not save recording: ' + error, 'error');
        };

        async function loadPassages() {
            readParams();
            document.getElementById('recordBtn').disabled = true;
            showMessage('Loading sentences...', 'info');
            try {
                const data = await rpc('af_reading_passages_today', {
                    p_profile: currentProfile(),
                    p_language: language,
                    p_count: count
                });
                day = data && data.day ? data.day : '';
                language = data && data.language ? data.language : language;
                passages = (data && data.passages) || [];
                if (!passages.length) {
                    document.getElementById('passage').textContent = 'No sentences are ready today.';
                    document.getElementById('recordBtn').disabled = true;
                    showMessage('Add sentences to the reading bank first.', 'error');
                    return;
                }
                index = passages.findIndex(function (item) { return !item.recorded; });
                hideMessage();
                document.getElementById('recordBtn').disabled = false;
                if (index < 0) showDone();
                else showPassage();
            } catch (err) {
                document.getElementById('recordBtn').disabled = true;
                showMessage(err && err.message ? err.message : String(err), 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadPassages);
        window.addEventListener('beforeunload', function() {
            stopRecording();
            stopMediaStream();
        });
    </script>
</body>
</html>
