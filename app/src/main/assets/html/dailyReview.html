<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Review</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f7fb; color: #1c2430; }
    .top { display: flex; gap: 16px; align-items: center; padding: 14px 18px; background: #1b3a4b; color: #fff; }
    .top h1 { margin: 0; font-size: 1.25rem; flex: 1; }
    .meta { opacity: .9; font-weight: 700; font-variant-numeric: tabular-nums; }
    .quiz { max-width: 800px; margin: 0 auto; padding: 16px 16px 28px; }
    .prompt, .question { font-size: 1.25rem; line-height: 1.35; margin: 0 0 8px; }
    .built { min-height: 1.4rem; font-weight: 700; margin: 8px 0; }
    .typed { width: 100%; font: inherit; font-size: 1.2rem; padding: 12px; border: 1px solid #c5d0db; border-radius: 12px; margin: 8px 0; }
    .choices { display: grid; gap: 10px; margin-top: 4px; }
    .choices button {
      font: inherit; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer;
      background: #fff; min-height: 52px; font-size: 1.15rem; text-align: left; width: 100%;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .choices button:disabled { opacity: .45; }
    .images { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 4px 0 16px; }
    .images img { max-width: 100%; max-height: min(58vh, 560px); object-fit: contain; background: #fff; border-radius: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; padding-top: 14px; border-top: 1px solid #d5dee8; }
    .row button {
      font: inherit; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer;
      background: #1b3a4b; color: #fff;
    }
    .row button.secondary { background: #d9e4ee; color: #1c2430; }
    .msg { font-weight: 700; min-height: 1.4rem; }
  </style>
</head>
<body>
  <header class="top">
    <h1 id="title">Daily Review</h1>
    <span id="score" class="meta"></span>
  </header>
  <main class="quiz">
    <p id="prompt" class="prompt"></p>
    <p id="question" class="question"></p>
    <div id="images" class="images"></div>
    <p id="built" class="built"></p>
    <input id="typed" class="typed" hidden autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type the answer">
    <div id="choices" class="choices"></div>
    <div class="row">
      <button type="button" id="deleteBtn" class="secondary">Delete</button>
      <button type="button" id="submitBtn">Submit</button>
      <button type="button" id="replayBtn" class="secondary" hidden>Hear again</button>
    </div>
    <p id="msg" class="msg"></p>
  </main>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const pack = String(params.get("pack") || "").trim();
      const task = window.BAEREN_TASK || {};
      const title = params.get("title") || task.title || pack || "Daily Review";
      const launch = task.launch || params.get("launch") || ("dailyReview_" + pack);
      const section = task.section || params.get("section") || "required";
      const stars = task.stars != null && task.stars !== "" ? task.stars : params.get("stars");

      document.getElementById("title").textContent = title;

      let questions = [];
      let index = 0;
      let answers = [];
      let locked = false;
      let current = null;
      let finished = false;

      function profile() {
        if (window.Baeren && Baeren.cfg) return Baeren.cfg().profile;
        if (window.Android && typeof Android.getCurrentProfile === "function") {
          return Android.getCurrentProfile();
        }
        return "AM";
      }

      function assetsBase() {
        if (window.Baeren && Baeren.ASSETS) return Baeren.ASSETS.replace(/\/$/, "");
        return "https://talq2me.github.io/BaerenEd/app/src/main/assets";
      }

      function assetUrl(path) {
        if (window.Baeren && typeof Baeren.assetUrl === "function") return Baeren.assetUrl(path);
        if (!path) return "";
        if (/^https?:/i.test(path)) return path;
        return assetsBase() + "/" + String(path).replace(/^\//, "");
      }

      async function loadJson(path) {
        const url = assetUrl(path) + (assetUrl(path).indexOf("?") >= 0 ? "&" : "?") + "nocache=" + Date.now();
        const res = await fetch(url);
        if (!res.ok) throw new Error("Could not load " + path);
        return res.json();
      }

      function localeOf(block) {
        const lang = (block && block.lang || "").toLowerCase();
        if (lang.startsWith("fr")) return "fr-FR";
        if (lang.startsWith("es")) return "es-ES";
        return "en-US";
      }

      function wantsTyped(q) {
        const raw = String((q && (q.response || q.input || q.answerType || q.type)) || "")
          .toLowerCase()
          .replace(/[\s-]+/g, "_");
        return raw === "type" || raw === "typed" || raw === "text" || raw === "write"
          || raw === "fill" || raw === "fill_in" || raw === "fill_in_the_blank"
          || raw === "fill_blank" || raw === "short" || raw === "short_answer";
      }

      function foldAnswer(s) {
        return String(s || "")
          .normalize("NFKC")
          .replace(/[’‘]/g, "'")
          .trim()
          .replace(/\s+/g, " ")
          .replace(/[.!?]+$/g, "")
          .toLowerCase();
      }

      function typedMatches(typed, choices) {
        const got = foldAnswer(typed);
        if (!got) return false;
        const parts = (choices || []).map(function (c) { return c.text; }).filter(Boolean);
        if (parts.some(function (text) { return foldAnswer(text) === got; })) return true;
        return parts.length > 1 && foldAnswer(parts.join(" ")) === got;
      }

      function resolveImage(src, basePath) {
        if (!src) return "";
        if (/^https?:/i.test(src) || String(src).indexOf("/") >= 0) return src;
        return basePath.replace(/\/?$/, "/") + src;
      }

      function speakCurrent() {
        if (!current || !window.Baeren || typeof Baeren.speak !== "function") return;
        const parts = [];
        let locale = "en-US";
        if (current.prompt && current.prompt.lang && current.prompt.text) {
          parts.push(current.prompt.text);
          locale = localeOf(current.prompt);
        }
        if (current.question && current.question.lang && current.question.text && current.question.displayText !== true) {
          parts.push(current.question.text);
          locale = localeOf(current.question);
        }
        if (parts.length) Baeren.speak(parts.join(". "), locale, Baeren.DEFAULT_RATE);
      }

      function scoreLabel() {
        if (!questions.length) return "";
        return "Q " + ((index % questions.length) + 1) + " / " + questions.length;
      }

      function showQuestion() {
        locked = false;
        answers = [];
        current = questions[index % questions.length];
        const prompt = current.prompt || {};
        const question = current.question || {};
        document.getElementById("prompt").textContent =
          (prompt.displayText || !prompt.lang) ? (prompt.text || "") : "";
        document.getElementById("question").textContent =
          question.displayText ? (question.text || "") : "";

        const images = document.getElementById("images");
        images.innerHTML = "";
        const sources = (question.media && question.media.images) || [];
        sources.forEach(function (src) {
          const img = document.createElement("img");
          img.alt = "";
          const resolved = resolveImage(src, current._basePath || "");
          const pngUrl = assetUrl(resolved);
          const webpUrl = pngUrl.replace(/\.png$/i, ".webp");
          img.src = webpUrl === pngUrl ? pngUrl : webpUrl;
          if (webpUrl !== pngUrl) {
            img.onerror = function () {
              img.onerror = null;
              img.src = pngUrl;
            };
          }
          images.appendChild(img);
        });

        const typedMode = wantsTyped(current);
        const built = document.getElementById("built");
        built.textContent = "";
        built.hidden = typedMode;
        document.getElementById("msg").textContent = "";
        const input = document.getElementById("typed");
        input.value = "";
        input.disabled = false;
        input.hidden = !typedMode;
        document.getElementById("deleteBtn").hidden = typedMode;
        const box = document.getElementById("choices");
        box.innerHTML = "";
        box.hidden = typedMode;
        if (typedMode) {
          const choices = current.correctChoices || [];
          const numeric = choices.length > 0 && choices.every(function (c) {
            return /^-?\d+([.,]\d+)?$/.test(String(c.text || "").trim());
          });
          input.inputMode = numeric ? "decimal" : "text";
        } else {
          const all = (current.correctChoices || []).concat(current.extraChoices || []);
          for (let i = all.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = all[i]; all[i] = all[j]; all[j] = tmp;
          }
          all.forEach(function (choice) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = choice.text;
            btn.addEventListener("click", function () {
              if (locked || btn.disabled) return;
              answers.push(choice.text);
              btn.disabled = true;
              document.getElementById("built").textContent = answers.join(" ");
            });
            box.appendChild(btn);
          });
        }
        document.getElementById("score").textContent = scoreLabel();
        document.getElementById("replayBtn").hidden = !(current.prompt && current.prompt.lang);
        if (typedMode) input.focus();
        speakCurrent();
      }

      async function loadProgress() {
        if (window.Android && typeof Android.loadProgress === "function") {
          const n = Number(Android.loadProgress());
          return Number.isFinite(n) && n > 0 ? n : 0;
        }
        if (window.Baeren && Baeren.hasDb && Baeren.hasDb()) {
          try { return await Baeren.loadGameIndex(launch); } catch (e) { console.warn(e); }
        }
        return 0;
      }

      async function finish(ok) {
        if (finished) return;
        finished = true;
        locked = true;
        document.getElementById("msg").textContent = "Saving…";
        // Advance the pool cursor only on a correct answer. A wrong answer (or a parent
        // reset back to incomplete) keeps the same question for review.
        const nextIndex = ok ? (index + 1) : index;
        const correct = ok ? 1 : 0;
        const incorrect = ok ? 0 : 1;
        try {
          if (window.Android && typeof Android.gameCompleted === "function") {
            Android.gameCompleted(correct, incorrect, nextIndex);
            document.getElementById("msg").textContent = ok ? "Correct — done for today." : "Saved. Ask a parent to reset if you want to try again.";
            return;
          }
          if (window.Baeren && Baeren.hasDb && Baeren.hasDb()) {
            await Baeren.saveGameIndex(launch, nextIndex);
            await Baeren.completeTask({
              title: title,
              section: section,
              stars: stars == null || stars === "" ? null : Number(stars),
              correct: correct,
              incorrect: incorrect,
              questionsAnswered: 1
            });
          }
          document.getElementById("msg").textContent = ok ? "Correct — done for today." : "Saved.";
          setTimeout(function () { location.href = "../../../../../index.html"; }, 900);
        } catch (err) {
          finished = false;
          document.getElementById("msg").textContent = err.message || String(err);
        }
      }

      document.getElementById("deleteBtn").addEventListener("click", function () {
        if (locked || !answers.length) return;
        answers.pop();
        const buttons = document.querySelectorAll("#choices button");
        const used = {};
        answers.forEach(function (text) { used[text] = (used[text] || 0) + 1; });
        const seen = {};
        buttons.forEach(function (btn) {
          const n = seen[btn.textContent] || 0;
          seen[btn.textContent] = n + 1;
          btn.disabled = n < (used[btn.textContent] || 0);
        });
        document.getElementById("built").textContent = answers.join(" ");
      });

      document.getElementById("typed").addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          document.getElementById("submitBtn").click();
        }
      });

      document.getElementById("submitBtn").addEventListener("click", async function () {
        if (locked || !current || finished) return;
        const typedMode = wantsTyped(current);
        const typedValue = document.getElementById("typed").value;
        if (typedMode && !foldAnswer(typedValue)) {
          document.getElementById("msg").textContent = "Type an answer.";
          document.getElementById("typed").focus();
          return;
        }
        locked = true;
        if (typedMode) document.getElementById("typed").disabled = true;
        const expected = (current.correctChoices || []).map(function (c) { return c.text; });
        const ok = typedMode
          ? typedMatches(typedValue, current.correctChoices)
          : answers.length === expected.length && answers.every(function (a, i) { return a === expected[i]; });

        let wait = 700;
        if (ok) {
          document.getElementById("msg").textContent = "Correct";
        } else if (expected[0]) {
          document.getElementById("msg").textContent = "Not quite. Answer: " + expected.join(" ");
          wait = 2200;
        } else {
          document.getElementById("msg").textContent = "Not quite";
          wait = 1200;
        }
        setTimeout(function () { finish(ok); }, wait);
      });

      document.getElementById("replayBtn").addEventListener("click", speakCurrent);

      (async function () {
        try {
          if (!pack) throw new Error("Missing pack= in the task URL.");
          const kid = profile();
          const base = "edusites/" + pack + "/" + kid;
          const manifest = await loadJson(base + "/manifest.json");
          const tests = (manifest && manifest.tests) || [];
          if (!tests.length) throw new Error("No tests in " + pack + "/" + kid + ".");

          const bank = [];
          for (let i = 0; i < tests.length; i++) {
            const test = tests[i];
            const testBase = base + "/" + test.id;
            const quizPath = testBase + "/" + (test.quiz || (test.id + "_quiz.json"));
            const items = await loadJson(quizPath);
            (items || []).forEach(function (q) {
              const copy = Object.assign({}, q);
              copy._basePath = testBase;
              bank.push(copy);
            });
          }
          if (!bank.length) throw new Error("That pack has no questions.");
          questions = bank;
          index = await loadProgress();
          if (index < 0) index = 0;
          showQuestion();
        } catch (err) {
          document.getElementById("msg").textContent = err.message || String(err);
        }
      })();
    })();
  </script>
</body>
</html>
