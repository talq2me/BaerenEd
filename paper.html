<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spelling</title>
  <link rel="stylesheet" href="baeren.css">
  <style>
    .words { display: grid; gap: 8px; }
    .word-row { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 12px; padding: 10px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .word-row .n { font-weight: 800; width: 2.2rem; font-size: 1.3rem; color: #1b3a4b; }
    .word-row button { background: #d9e4ee; color: #1c2430; }
    .word-row.heard { background: #e7f6ec; }
    .preview-wrap { background: #fff; border-radius: 12px; padding: 12px; margin-top: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .preview-wrap img { width: 100%; border-radius: 8px; }
    #photoBtn, #sendBtn { background: #1b3a4b; color: #fff; }
    #photoBtn:disabled, #sendBtn:disabled { opacity: .45; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <header class="top">
    <a href="index.html">Back</a>
    <h1 id="title">Spelling</h1>
    <span id="profileLabel" class="profile-label"></span>
    <span id="score"></span>
  </header>
  <main class="quiz">
    <p id="prompt" class="prompt">Listen to each word in order and write it on paper. After the last word, take a photo of your list.</p>
    <div id="words" class="words"></div>
    <div class="row" style="margin-top:12px">
      <button type="button" id="photoBtn" disabled>Take photo</button>
      <button type="button" id="sendBtn" disabled>Send</button>
    </div>
    <div id="previewWrap" class="preview-wrap" hidden>
      <img id="preview" alt="Your spelling paper">
    </div>
    <p id="msg" class="msg"></p>
  </main>
  <input type="file" id="cameraInput" accept="image/*" capture="environment">
  <script src="baeren.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const file = (params.get("file") || "").replace(/^.*\//, "");
    const title = params.get("title") || "Spelling";
    const section = params.get("section") || "required";
    const stars = params.get("stars");
    const launch = params.get("launch") || "";
    const cap = Math.max(0, parseInt(params.get("questions") || "0", 10) || 0);
    const french = launch === "frSpellPhoto" || /french/i.test(file) || /french/i.test(title);
    const gameName = french ? "FrSpellingOCRPaper" : "EngSpellingOCRPaper";
    const locale = french ? "fr-FR" : "en-US";
    const language = french ? "fr" : "eng";
    document.getElementById("title").textContent = title;

    let words = [];
    let heard = 0;
    let speaking = false;
    let busy = false;
    let photo = null;

    function torontoYmd() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Toronto",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
    }

    function render() {
      document.getElementById("score").textContent = words.length ? (Math.min(heard, words.length) + " / " + words.length) : "";
      document.getElementById("photoBtn").disabled = busy || speaking || heard < words.length;
      document.getElementById("sendBtn").disabled = busy || speaking || !photo;
      const box = document.getElementById("words");
      box.querySelectorAll(".word-row").forEach(function (row, i) {
        row.classList.toggle("heard", i < heard);
        const btn = row.querySelector("button");
        btn.disabled = busy || speaking || i > heard;
        btn.textContent = i < heard ? "Hear again" : "Hear";
      });
    }

    function playAt(i) {
      if (busy || speaking || i > heard || !words[i]) return;
      speaking = true;
      render();
      const item = words[i];
      const line = (item.sentence ? item.sentence + ". " : "") + "Spell: " + item.word;
      Baeren.speak(line, locale, 0.75, function () {
        speaking = false;
        if (i === heard) heard++;
        render();
      });
    }

    function showWords() {
      const box = document.getElementById("words");
      box.innerHTML = "";
      words.forEach(function (item, i) {
        const row = document.createElement("div");
        row.className = "word-row";
        const num = document.createElement("div");
        num.className = "n";
        num.textContent = (i + 1) + ".";
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "Hear";
        btn.addEventListener("click", function () { playAt(i); });
        row.appendChild(num);
        row.appendChild(btn);
        box.appendChild(row);
      });
      render();
    }

    function compressPhoto(dataUrl) {
      return new Promise(function (resolve, reject) {
        const img = new Image();
        img.onload = function () {
          const max = 1600;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        };
        img.onerror = function () { reject(new Error("Could not read that photo.")); };
        img.src = dataUrl;
      });
    }

    document.getElementById("photoBtn").addEventListener("click", function () {
      if (busy || heard < words.length) return;
      document.getElementById("cameraInput").click();
    });

    document.getElementById("cameraInput").addEventListener("change", function (event) {
      const fileInput = event.target.files && event.target.files[0];
      if (!fileInput) return;
      const reader = new FileReader();
      reader.onload = function () {
        photo = reader.result;
        document.getElementById("preview").src = photo;
        document.getElementById("previewWrap").hidden = false;
        document.getElementById("msg").textContent = "";
        render();
      };
      reader.readAsDataURL(fileInput);
    });

    document.getElementById("sendBtn").addEventListener("click", async function () {
      if (busy || speaking || !photo || heard < words.length || !words.length) return;
      if (!Baeren.hasDb()) {
        document.getElementById("msg").textContent = "Supabase is not configured in this browser.";
        return;
      }
      busy = true;
      render();
      document.getElementById("msg").textContent = "Saving…";
      try {
        const profile = Baeren.cfg().profile;
        const day = torontoYmd();
        const joined = words.map(function (item) {
          return String(item.word || "").replace(/\|/g, "").trim();
        }).filter(Boolean).join("|");
        const task = gameName + "-" + day + "-" + joined + "-unverified";
        const pattern = gameName + "-" + day + "-%";
        try { await Baeren.rpc("af_cleanup_old_chore_videos", { p_days: 7 }); } catch (e) { console.warn(e); }
        await Baeren.rpc("af_delete_image_uploads_ilike", {
          p_profile: profile,
          p_task_pattern: pattern
        });
        const dataUrl = await compressPhoto(photo);
        await Baeren.rpc("af_upsert_image_upload", {
          p_profile: profile,
          p_task: task,
          p_image: dataUrl.slice(dataUrl.indexOf(",") + 1)
        });
        await Baeren.rpc("af_enqueue_spelling_paper_review", {
          p_profile: profile,
          p_language: language,
          p_date: day,
          p_expected_count: 1
        });
        await Baeren.completeTask({
          title: title,
          section: section,
          stars: stars == null || stars === "" ? null : Number(stars),
          correct: 0,
          incorrect: words.length,
          questionsAnswered: words.length
        });
        document.getElementById("msg").textContent = "Done.";
        setTimeout(function () { location.href = "index.html"; }, 700);
      } catch (err) {
        busy = false;
        render();
        document.getElementById("msg").textContent = err.message || String(err);
      }
    });

    (async function () {
      try {
        if (!file) throw new Error("This spelling game has no word list.");
        const loaded = JSON.parse(await Baeren.loadJson(file));
        words = loaded.filter(function (item) { return item && item.word; });
        if (cap > 0) words = words.slice(0, cap);
        if (!words.length) throw new Error("That word list is empty.");
        showWords();
      } catch (err) {
        document.getElementById("msg").textContent = err.message || String(err);
      }
    })();
  </script>
</body>
</html>
