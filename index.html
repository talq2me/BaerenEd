<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BaerenEd</title>
  <link rel="stylesheet" href="baeren.css">
</head>
<body>
  <header class="top">
    <button type="button" id="refreshBtn" class="icon-btn" aria-label="Refresh">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
        <path d="M21 3v6h-6"/>
      </svg>
    </button>
    <h1>Battle hub</h1>
    <span id="profileLabel" class="profile-label"></span>
    <div id="counts" class="counts"></div>
    <div class="top-actions">
      <button type="button" id="rewardBtn">Ask for Time</button>
      <button type="button" id="configBtn" class="icon-btn" aria-label="Parent setup">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>
  <div class="wrap">
    <form id="setup" class="panel" hidden>
      <h2>Parent setup</h2>
      <p>The key stays in this browser. It is not saved in the page.</p>
      <label for="pinEntry">PIN</label>
      <input id="pinEntry" type="password" inputmode="numeric" autocomplete="off">
      <div class="row" id="pinRow" hidden><button type="button" id="pinBtn">Continue</button></div>
      <div id="secretFields" hidden>
        <p>Profile</p>
        <div class="profiles" id="profiles">
          <button type="button" data-profile="AM">AM</button>
          <button type="button" data-profile="BM">BM</button>
          <button type="button" data-profile="TE">TE</button>
        </div>
        <label for="supabaseUrl">Supabase URL</label>
        <input id="supabaseUrl" autocomplete="off" spellcheck="false">
        <label for="supabaseKey">Supabase API key</label>
        <input id="supabaseKey" autocomplete="off" spellcheck="false">
        <label for="newPin">New PIN</label>
        <input id="newPin" type="password" inputmode="numeric" autocomplete="off">
        <div class="row"><button type="submit">Save</button></div>
      </div>
      <p id="setupMsg"></p>
    </form>

    <section id="hub" class="panel" hidden>
      <a class="task pokedex-link" href="pokedex.html" id="pokedexLink">My Pokemon</a>
      <p id="battleMsg" class="battle-msg"></p>
      <div class="row battle-row">
        <button type="button" id="battleBtn" disabled>Battle</button>
        <button type="button" id="spinBtn" disabled>Daily Spin</button>
      </div>
      <div class="battle" id="battle"></div>
      <div class="row maps">
        <a class="task" href="map.html?map=required">Required</a>
        <button type="button" id="practiceBtn" disabled>Practice</button>
      </div>
      <p id="hubMsg"></p>
    </section>
    <p id="needSetup" hidden>Save the Supabase URL and key in Parent setup to load the games.</p>
  </div>
  <div id="wheel" class="victory" hidden>
    <div class="victory-card wheel-card">
      <h2>Daily Spin</h2>
      <div class="wheel-wrap">
        <div class="wheel-pointer"></div>
        <canvas id="wheelCanvas" width="300" height="300"></canvas>
      </div>
      <p id="wheelMsg">Tap Spin for today's prize!</p>
      <div class="row wheel-actions">
        <button type="button" id="wheelSpin">Spin</button>
        <button type="button" id="wheelClose">Close</button>
      </div>
    </div>
  </div>
  <div id="victory" class="victory" hidden>
    <div class="victory-card">
      <h2>Victory!</h2>
      <img id="victoryImg" alt="">
      <p id="victoryName"></p>
      <button type="button" id="victoryClose">Continue</button>
    </div>
  </div>
  <script src="baeren.js"></script>
  <script src="tasks.js"></script>
  <script src="battle.js"></script>
  <script>
    function meter(label, id, pct) {
      const row = document.createElement("div");
      row.className = "meter";
      const name = document.createElement("span");
      name.textContent = label;
      const track = document.createElement("div");
      track.className = "track";
      const fill = document.createElement("div");
      fill.className = "fill";
      fill.id = id;
      fill.style.width = pct + "%";
      track.appendChild(fill);
      row.appendChild(name);
      row.appendChild(track);
      return row;
    }

    function fighterCard(poke, who, power) {
      const card = document.createElement("div");
      card.className = "fighter";
      card.dataset.who = who;
      const img = document.createElement("img");
      const name = document.createElement("div");
      if (poke) {
        img.alt = "#" + poke.pokenum;
        img.src = Baeren.assetUrl("images/pokeSprites/sprites/pokemon/" + poke.filename);
        name.textContent = "#" + poke.pokenum;
      } else {
        img.alt = "";
        name.textContent = "None yet";
      }
      card.appendChild(img);
      card.appendChild(name);
      card.appendChild(meter("HP", who + "Hp", 100));
      card.appendChild(meter("Power", who + "Power", power));
      return card;
    }

    function renderBattle(all, unlocked, power) {
      const owned = all.filter(function (poke) { return poke.prefix <= unlocked; });
      const playerPrefix = owned.reduce(function (max, poke) { return Math.max(max, poke.prefix); }, 0);
      const player = playerPrefix ? Tasks.pickAtPrefix(all, playerPrefix) : null;
      const boss = Tasks.pickAtPrefix(all, unlocked + 1);
      const battle = document.getElementById("battle");
      battle.textContent = "";
      battle.appendChild(fighterCard(player, "player", power));
      const vs = document.createElement("div");
      vs.className = "vs";
      vs.textContent = "VS";
      battle.appendChild(vs);
      battle.appendChild(fighterCard(boss, "boss", 100));
      window.hubBattle = window.hubBattle || {};
      window.hubBattle.unlocked = unlocked;
      window.hubBattle.bossName = boss ? "#" + boss.pokenum : "Boss";
      window.hubBattle.bossFile = boss ? boss.filename : "";
    }

    function renderCounts(hub) {
      const bank = Number(hub.kid_bank_balance || 0).toFixed(2);
      document.getElementById("counts").textContent =
        "$" + bank + " \u{1F3E6}   " +
        (hub.coins_earned || 0) + " \u{1FA99}   " +
        (hub.berries_earned || 0) + " \u{1F34D}   " +
        (hub.banked_mins || 0) + " \u{23F1}";
    }

    const PRACTICE_FILL = 16;

    function countable(task) {
      const how = Tasks.kind(task);
      return how !== "skip" && how !== "later";
    }

    async function loadHub(profile) {
      const hub = await Baeren.rpc("af_get_battle_hub_counts", { p_profile: profile }) || {};
      const rows = await Baeren.rpc("af_web_list_tasks", { p_profile: profile }) || [];
      const requiredRows = await Baeren.rpc("af_get_tasks_required", { p_profile: profile });
      const practiceRows = await Baeren.rpc("af_get_tasks_practice", { p_profile: profile });
      const battleState = await Baeren.rpc("af_web_battle_state", { p_profile: profile }) || {};
      const requiredDone = Tasks.completionMap(requiredRows, true);
      const practiceDoneMap = Tasks.completionMap(practiceRows, false);
      const required = rows.filter(function (task) {
        return task.section === "required" && countable(task);
      });
      const practice = rows.filter(function (task) {
        return task.section === "optional" && countable(task);
      });
      const allDone = required.every(function (task) { return requiredDone[task.title] === true; });
      const practiceDone = practice.filter(function (task) { return practiceDoneMap[task.title] === true; }).length;
      document.getElementById("hub").hidden = false;
      document.getElementById("needSetup").hidden = true;
      renderCounts(hub);
      document.getElementById("pokedexLink").textContent = "My Pokemon (" + (hub.pokemon_unlocked || 0) + ")";
      const practiceBtn = document.getElementById("practiceBtn");
      practiceBtn.disabled = !allDone;
      const unlocked = Number(hub.pokemon_unlocked || 0);
      const battledToday = battleState.battleToday === true;
      let doneCount;
      let total;
      let power;
      let ready;
      if (battledToday) {
        const gained = Math.max(0, practiceDone - Number(battleState.practiceBaseline || 0));
        doneCount = gained;
        total = PRACTICE_FILL;
        power = Math.min(100, Math.round(gained * 100 / PRACTICE_FILL));
        ready = gained >= PRACTICE_FILL;
      } else {
        doneCount = required.filter(function (task) { return requiredDone[task.title] === true; }).length;
        total = required.length;
        power = total > 0 ? Math.round(doneCount * 100 / total) : 0;
        ready = total > 0 && doneCount >= total;
      }
      document.getElementById("hubMsg").textContent = battledToday
        ? (ready ? "Practice power is full." : "Finish Practice tasks to fill the power bar.")
        : (allDone ? "Required games are done." : "Finish the Required games to open Practice.");
      const battleBtn = document.getElementById("battleBtn");
      battleBtn.disabled = !ready;
      battleBtn.textContent = "Battle";
      const prize = String(hub.prize_unlocked || "").trim();
      const spinBtn = document.getElementById("spinBtn");
      spinBtn.disabled = !(allDone && required.length > 0) && !prize;
      spinBtn.textContent = prize ? "Today's Prize" : "Daily Spin";
      window.hubBattle = {
        unlocked: unlocked,
        done: doneCount,
        total: total,
        practiceDone: practiceDone,
        practiceFill: PRACTICE_FILL
      };
      try {
        renderBattle(await Tasks.loadPokemonManifest(), unlocked, power);
      } catch (err) {
        document.getElementById("battle").textContent = err.message || String(err);
      }
    }

    function showArena() {
      document.body.classList.add("arena");
      const png = Baeren.assetUrl("images/arena.png");
      const webp = Baeren.assetUrl("images/arena.webp");
      const probe = new Image();
      probe.onload = function () { document.body.style.backgroundImage = "url(\"" + probe.src + "\")"; };
      probe.onerror = function () {
        if (probe.src.indexOf(".webp") >= 0) probe.src = png;
      };
      probe.src = webp;
    }

    async function loadProfile(profile) {
      if (window.Battle) Battle.cancel();
      const victory = document.getElementById("victory");
      if (victory) victory.hidden = true;
      Baeren.setProfile(profile);
      document.querySelectorAll("#profiles button").forEach(function (btn) {
        btn.classList.toggle("on", btn.dataset.profile === profile);
      });
      if (!Baeren.hasDb()) {
        document.getElementById("hub").hidden = true;
        document.getElementById("needSetup").hidden = false;
        return;
      }
      await Baeren.ensureDailyReset();
      await loadHub(profile);
    }

    const setup = document.getElementById("setup");
    const secret = document.getElementById("secretFields");
    const pinRow = document.getElementById("pinRow");

    function unlockPin() {
      if (Baeren.checkPin(document.getElementById("pinEntry").value)) {
        secret.hidden = false;
        pinRow.hidden = true;
        document.getElementById("supabaseUrl").value = Baeren.cfg().url;
        document.getElementById("supabaseKey").value = Baeren.cfg().key;
        document.getElementById("setupMsg").textContent = "";
      } else {
        document.getElementById("setupMsg").textContent = "Wrong PIN.";
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", function () {
      location.reload();
    });

    document.getElementById("configBtn").addEventListener("click", function () {
      setup.hidden = !setup.hidden;
      const hasPin = Boolean(Baeren.cfg().pin);
      secret.hidden = hasPin;
      pinRow.hidden = !hasPin;
      document.getElementById("setupMsg").textContent = hasPin ? "Enter the PIN to change the profile or the saved key." : "Choose a PIN, then save the Supabase URL and key.";
    });

    document.getElementById("pinBtn").addEventListener("click", unlockPin);
    document.getElementById("pinEntry").addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && !pinRow.hidden) {
        ev.preventDefault();
        unlockPin();
      }
    });

    setup.addEventListener("submit", function (ev) {
      ev.preventDefault();
      if (!pinRow.hidden) {
        unlockPin();
        return;
      }
      const url = document.getElementById("supabaseUrl").value.trim();
      const key = document.getElementById("supabaseKey").value.trim();
      const pin = (document.getElementById("newPin").value || document.getElementById("pinEntry").value).trim();
      if (!url || !key || !pin) {
        document.getElementById("setupMsg").textContent = "URL, key, and PIN are required.";
        return;
      }
      Baeren.saveSetup(url, key, pin, Baeren.cfg().profile);
      document.getElementById("setupMsg").textContent = "Saved in this browser.";
      setup.hidden = true;
    });

    document.getElementById("rewardBtn").addEventListener("click", async function () {
      const pin = window.prompt("Parent PIN");
      if (pin == null) return;
      if (!Baeren.checkPin(pin)) {
        document.getElementById("hubMsg").textContent = "Wrong PIN.";
        return;
      }
      const raw = window.prompt("Minutes to add to the reward bank");
      if (raw == null) return;
      const minutes = parseInt(raw, 10);
      if (!Number.isFinite(minutes) || minutes === 0) return;
      try {
        await Baeren.rpc("af_reward_time_add", { p_profile: Baeren.cfg().profile, p_minutes: minutes });
        await loadHub(Baeren.cfg().profile);
      } catch (err) {
        document.getElementById("hubMsg").textContent = err.message || String(err);
      }
    });

    const WHEEL_COLORS = ["#FFCDD2", "#FFE0B2", "#FFF9C4", "#C8E6C9", "#B3E5FC", "#D1C4E9"];
    let wheelRewards = [];
    let wheelAngle = 0;
    let wheelSpinning = false;

    function wheelSweep(rewards) {
      const total = rewards.reduce(function (sum, reward) {
        return sum + Math.max(0, Number(reward.percent) || 0);
      }, 0) || 1;
      return rewards.map(function (reward) {
        return (Math.max(0, Number(reward.percent) || 0) / total) * 360;
      });
    }

    function landingRotation(rewards, index) {
      const sweeps = wheelSweep(rewards);
      let start = -90;
      for (let i = 0; i < sweeps.length; i++) {
        if (i === index) return 270 - (start + sweeps[i] / 2);
        start += sweeps[i];
      }
      return 0;
    }

    function wrapWheelLabel(text, maxChars) {
      const words = String(text || "").split(/\s+/);
      const lines = [];
      let line = "";
      words.forEach(function (word) {
        const next = line ? line + " " + word : word;
        if (next.length <= maxChars) line = next;
        else {
          if (line) lines.push(line);
          line = word;
        }
      });
      if (line) lines.push(line);
      return lines.slice(0, 3);
    }

    function drawWheel(angle) {
      const canvas = document.getElementById("wheelCanvas");
      const ctx = canvas.getContext("2d");
      const size = canvas.width;
      const cx = size / 2;
      const cy = size / 2;
      const radius = size * 0.44;
      ctx.clearRect(0, 0, size, size);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle * Math.PI / 180);
      if (!wheelRewards.length) {
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fillStyle = "#d0d0d0";
        ctx.fill();
      } else {
        const sweeps = wheelSweep(wheelRewards);
        let start = -90;
        wheelRewards.forEach(function (reward, i) {
          const sweep = sweeps[i];
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, radius, start * Math.PI / 180, (start + sweep) * Math.PI / 180);
          ctx.closePath();
          ctx.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length];
          ctx.fill();
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 2;
          ctx.stroke();
          const mid = (start + sweep / 2) * Math.PI / 180;
          const tx = Math.cos(mid) * radius * 0.62;
          const ty = Math.sin(mid) * radius * 0.62;
          ctx.save();
          ctx.translate(tx, ty);
          ctx.rotate(mid + Math.PI / 2);
          ctx.fillStyle = "#111";
          ctx.font = "bold 13px system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const lines = wrapWheelLabel(reward.name, sweep < 40 ? 8 : 12);
          lines.forEach(function (text, line) {
            ctx.fillText(text, 0, (line - (lines.length - 1) / 2) * 14);
          });
          ctx.restore();
          start += sweep;
        });
      }
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.fill();
      ctx.restore();
    }

    function spinWheelTo(index) {
      const target = ((landingRotation(wheelRewards, index) % 360) + 360) % 360;
      const start = wheelAngle;
      const startMod = ((start % 360) + 360) % 360;
      let delta = target - startMod;
      if (delta < 0) delta += 360;
      const change = (7 * 360) + delta;
      const duration = 4600;
      const begun = performance.now();
      wheelSpinning = true;
      document.getElementById("wheelSpin").disabled = true;
      document.getElementById("wheelMsg").textContent = "Spinning...";
      return new Promise(function (resolve) {
        function frame(now) {
          const t = Math.min(1, (now - begun) / duration);
          const eased = 1 - Math.pow(1 - t, 2);
          wheelAngle = start + change * eased;
          drawWheel(wheelAngle);
          if (t < 1) requestAnimationFrame(frame);
          else {
            wheelSpinning = false;
            document.getElementById("wheelSpin").disabled = false;
            resolve();
          }
        }
        requestAnimationFrame(frame);
      });
    }

    async function loadWheelRewards() {
      if (wheelRewards.length) return wheelRewards;
      const c = Baeren.cfg();
      const res = await fetch(c.url + "/rest/v1/reward_spinner?select=id,name,percent&percent=gt.0&order=id.asc", {
        headers: { apikey: c.key, Authorization: "Bearer " + c.key }
      });
      const text = await res.text();
      if (!res.ok) throw new Error("Could not load the prizes.");
      wheelRewards = JSON.parse(text || "[]");
      return wheelRewards;
    }

    async function openWheel() {
      document.getElementById("wheel").hidden = false;
      document.getElementById("wheelMsg").textContent = "Tap Spin for today's prize!";
      document.getElementById("wheelSpin").textContent = "Spin";
      document.getElementById("wheelSpin").disabled = true;
      drawWheel(wheelAngle);
      try {
        await loadWheelRewards();
        drawWheel(wheelAngle);
        document.getElementById("wheelSpin").disabled = false;
      } catch (err) {
        document.getElementById("wheelMsg").textContent = err.message || String(err);
      }
    }

    async function spinForPrize() {
      if (wheelSpinning) return;
      const spin = document.getElementById("wheelSpin");
      spin.disabled = true;
      document.getElementById("wheelMsg").textContent = "Checking today's prize...";
      try {
        const result = await Baeren.rpc("af_get_or_unlock_daily_prize", { p_profile: Baeren.cfg().profile }) || {};
        const prize = String(result.prize_unlocked || "").trim();
        if (!prize) {
          const err = String(result.error || "").trim();
          document.getElementById("wheelMsg").textContent = err
            ? err
            : "Finish today's required tasks, then tap Spin again.";
          spin.disabled = false;
          return;
        }
        const index = wheelRewards.findIndex(function (reward) {
          return String(reward.name || "").toLowerCase() === prize.toLowerCase();
        });
        if (index >= 0) await spinWheelTo(index);
        document.getElementById("wheelMsg").textContent = "Today's prize: " + prize;
        spin.textContent = "Show Prize";
        spin.disabled = false;
        await loadHub(Baeren.cfg().profile);
      } catch (err) {
        document.getElementById("wheelMsg").textContent = err.message || String(err);
        spin.disabled = false;
      }
    }

    document.getElementById("spinBtn").addEventListener("click", function () {
      if (document.getElementById("spinBtn").disabled) return;
      openWheel();
    });
    document.getElementById("wheelSpin").addEventListener("click", function () {
      spinForPrize();
    });
    document.getElementById("wheelClose").addEventListener("click", function () {
      if (wheelSpinning) return;
      document.getElementById("wheel").hidden = true;
    });

    document.getElementById("battleBtn").addEventListener("click", function () {
      Battle.start().catch(function (err) {
        document.getElementById("battleMsg").textContent = err.message || String(err);
      });
    });

    document.getElementById("victoryClose").addEventListener("click", function () {
      document.getElementById("victory").hidden = true;
      loadHub(Baeren.cfg().profile).catch(function (err) {
        document.getElementById("hubMsg").textContent = err.message || String(err);
      });
    });

    document.getElementById("practiceBtn").addEventListener("click", function () {
      if (!document.getElementById("practiceBtn").disabled) location.href = "map.html?map=practice";
    });

    document.getElementById("profiles").addEventListener("click", function (ev) {
      const btn = ev.target.closest("button");
      if (!btn) return;
      loadProfile(btn.dataset.profile).catch(function (err) {
        document.getElementById("hubMsg").textContent = err.message || String(err);
      });
    });

    showArena();
    loadProfile(Baeren.cfg().profile).catch(function (err) {
      document.getElementById("needSetup").hidden = false;
      document.getElementById("needSetup").textContent = err.message || String(err);
    });
  </script>
</body>
</html>
