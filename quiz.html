<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz</title>
  <link rel="stylesheet" href="baeren.css">
</head>
<body>
  <header class="top">
    <a href="index.html">Back</a>
    <h1 id="title">Quiz</h1>
    <span id="profileLabel" class="profile-label"></span>
    <span id="score"></span>
  </header>
  <main class="quiz">
    <p id="prompt" class="prompt"></p>
    <p id="question" class="question"></p>
    <div id="images" class="images"></div>
    <p id="built" class="built"></p>
    <input id="typed" class="typed" hidden autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type the answer">
    <div id="choices" class="choices"></div>
    <div class="row">
      <button type="button" id="deleteBtn">Delete</button>
      <button type="button" id="submitBtn">Submit</button>
      <button type="button" id="replayBtn" hidden>Hear again</button>
    </div>
    <p id="msg" class="msg"></p>
  </main>
  <script src="baeren.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const launch = params.get("launch") || params.get("file") || "quiz";
    const file = (params.get("file") || (launch + ".json")).replace(/^.*\//, "");
    const title = params.get("title") || launch;
    const section = params.get("section") || "optional";
    const stars = params.get("stars");
    const throughAll = params.get("through") === "all";
    let need = Math.max(1, parseInt(params.get("questions") || "5", 10) || 5);
    document.getElementById("title").textContent = title;

    let questions = [];
    let index = 0;
    let correctCount = 0;
    let incorrectCount = 0;
    let answers = [];
    let locked = false;
    let current = null;

    function goalReached() {
      if (throughAll) return index >= questions.length;
      return correctCount >= need;
    }

    function scoreLabel() {
      if (throughAll) return (correctCount + incorrectCount) + " / " + need;
      return correctCount + " / " + need;
    }

    function localeOf(block) {
      const lang = (block && block.lang || "").toLowerCase();
      if (lang.startsWith("fr")) return "fr-FR";
      if (lang.startsWith("es")) return "es-ES";
      return "en-US";
    }

    function wantsTyped(q) {
      const raw = String((q && (q.response || q.input || q.answerType || q.type)) || "")
        .toLowerCase()
        .replace(/[\s-]+/g, "_");
      return raw === "type" || raw === "typed" || raw === "text" || raw === "write"
        || raw === "fill" || raw === "fill_in" || raw === "fill_in_the_blank"
        || raw === "fill_blank" || raw === "short" || raw === "short_answer";
    }

    function foldAnswer(s) {
      return String(s || "")
        .normalize("NFKC")
        .replace(/[’‘]/g, "'")
        .trim()
        .replace(/\s+/g, " ")
        .replace(/[.!?]+$/g, "")
        .toLowerCase();
    }

    function typedMatches(typed, choices) {
      const got = foldAnswer(typed);
      if (!got) return false;
      const parts = (choices || []).map(function (c) { return c.text; }).filter(Boolean);
      if (parts.some(function (text) { return foldAnswer(text) === got; })) return true;
      return parts.length > 1 && foldAnswer(parts.join(" ")) === got;
    }

    function speakCurrent() {
      if (!current) return;
      const parts = [];
      let locale = "en-US";
      if (current.prompt && current.prompt.lang && current.prompt.text) {
        parts.push(current.prompt.text);
        locale = localeOf(current.prompt);
      }
      if (current.question && current.question.lang && current.question.text && current.question.displayText !== true) {
        parts.push(current.question.text);
        locale = localeOf(current.question);
      }
      if (parts.length) Baeren.speak(parts.join(". "), locale, Baeren.DEFAULT_RATE);
    }

    function showQuestion() {
      locked = false;
      answers = [];
      current = questions[index % questions.length];
      const prompt = current.prompt || {};
      const question = current.question || {};
      const promptEl = document.getElementById("prompt");
      const questionEl = document.getElementById("question");
      promptEl.textContent = (prompt.displayText || !prompt.lang) ? (prompt.text || "") : "";
      questionEl.textContent = question.displayText ? (question.text || "") : "";
      const images = document.getElementById("images");
      images.innerHTML = "";
      const sources = (question.media && question.media.images) || [];
      sources.forEach(function (src) {
        const img = document.createElement("img");
        img.alt = "";
        if (sources.length === 1 && /\/review\//i.test(String(src))) img.className = "diagram";
        const pngUrl = Baeren.assetUrl(src);
        const webpUrl = pngUrl.replace(/\.png$/i, ".webp");
        img.src = webpUrl === pngUrl ? pngUrl : webpUrl;
        if (webpUrl !== pngUrl) {
          img.onerror = function () {
            img.onerror = null;
            img.src = pngUrl;
          };
        }
        images.appendChild(img);
      });
      const typedMode = wantsTyped(current);
      const built = document.getElementById("built");
      built.textContent = "";
      built.hidden = typedMode;
      document.getElementById("msg").textContent = "";
      const input = document.getElementById("typed");
      input.value = "";
      input.disabled = false;
      input.hidden = !typedMode;
      document.getElementById("deleteBtn").hidden = typedMode;
      const box = document.getElementById("choices");
      box.innerHTML = "";
      box.hidden = typedMode;
      if (typedMode) {
        const choices = current.correctChoices || [];
        const numeric = choices.length > 0 && choices.every(function (c) {
          return /^-?\d+([.,]\d+)?$/.test(String(c.text || "").trim());
        });
        input.inputMode = numeric ? "decimal" : "text";
      } else {
        const all = (current.correctChoices || []).concat(current.extraChoices || []);
        for (let i = all.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = all[i]; all[i] = all[j]; all[j] = tmp;
        }
        all.forEach(function (choice) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = choice.text;
          btn.addEventListener("click", function () {
            if (locked || btn.disabled) return;
            answers.push(choice.text);
            btn.disabled = true;
            document.getElementById("built").textContent = answers.join(" ");
          });
          box.appendChild(btn);
        });
      }
      document.getElementById("score").textContent = scoreLabel();
      document.getElementById("replayBtn").hidden = !(current.prompt && current.prompt.lang);
      if (typedMode) input.focus();
      speakCurrent();
    }

    async function finish() {
      locked = true;
      document.getElementById("msg").textContent = "Saving…";
      try {
        if (Baeren.hasDb()) {
          await Baeren.saveGameIndex(launch, index);
          await Baeren.completeTask({
            title: title,
            section: section,
            stars: stars == null || stars === "" ? null : Number(stars),
            correct: correctCount,
            incorrect: incorrectCount,
            questionsAnswered: correctCount + incorrectCount
          });
        }
        document.getElementById("msg").textContent = "Done.";
        setTimeout(function () { location.href = "index.html"; }, 700);
      } catch (err) {
        document.getElementById("msg").textContent = err.message || String(err);
      }
    }

    document.getElementById("deleteBtn").addEventListener("click", function () {
      if (locked || !answers.length) return;
      answers.pop();
      const buttons = document.querySelectorAll("#choices button");
      const used = {};
      answers.forEach(function (text) { used[text] = (used[text] || 0) + 1; });
      const seen = {};
      buttons.forEach(function (btn) {
        const n = seen[btn.textContent] || 0;
        seen[btn.textContent] = n + 1;
        btn.disabled = n < (used[btn.textContent] || 0);
      });
      document.getElementById("built").textContent = answers.join(" ");
    });

    document.getElementById("typed").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        document.getElementById("submitBtn").click();
      }
    });

    document.getElementById("submitBtn").addEventListener("click", async function () {
      if (locked || !current) return;
      const typedMode = wantsTyped(current);
      const typedValue = document.getElementById("typed").value;
      if (typedMode && !foldAnswer(typedValue)) {
        document.getElementById("msg").textContent = "Type an answer.";
        document.getElementById("typed").focus();
        return;
      }
      locked = true;
      if (typedMode) document.getElementById("typed").disabled = true;
      const expected = (current.correctChoices || []).map(function (c) { return c.text; });
      const ok = typedMode
        ? typedMatches(typedValue, current.correctChoices)
        : answers.length === expected.length && answers.every(function (a, i) { return a === expected[i]; });
      if (ok) correctCount++; else incorrectCount++;
      index++;
      let wait = 600;
      if (ok) {
        document.getElementById("msg").textContent = "Correct";
      } else if (typedMode && expected[0]) {
        document.getElementById("msg").textContent = "Not quite. " + expected[0];
        wait = 1600;
      } else {
        document.getElementById("msg").textContent = "Not quite";
      }
      if (Baeren.hasDb()) {
        try { await Baeren.saveGameIndex(launch, index); } catch (e) { console.warn(e); }
      }
      if (goalReached()) { await finish(); return; }
      setTimeout(showQuestion, wait);
    });

    document.getElementById("replayBtn").addEventListener("click", speakCurrent);

    (async function () {
      try {
        if (Baeren.hasDb()) {
          try { index = await Baeren.loadGameIndex(launch); } catch (e) { console.warn(e); }
        }
        questions = JSON.parse(await Baeren.loadJson(file));
        if (!questions.length) throw new Error("That game has no questions.");
        if (throughAll) {
          need = questions.length;
          if (index >= questions.length) index = 0;
        }
        showQuestion();
      } catch (err) {
        document.getElementById("msg").textContent = err.message || String(err);
      }
    })();
  </script>
</body>
</html>
