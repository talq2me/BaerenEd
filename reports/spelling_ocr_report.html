<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling OCR Report</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(160deg, #5a7a9c 0%, #4a6a8a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.2);
            padding: 16px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 16px;
            text-align: left;
        }

        .page-header h1 {
            color: #222;
            margin: 0;
            font-size: 1.15em;
            font-weight: 700;
        }

        .game-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .game-button {
            background: #5a7a9c;
            color: white;
            border: none;
            padding: 14px 10px;
            border-radius: 11px;
            font-size: 0.92em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 48px;
        }

        .game-count {
            display: block;
            margin-top: 4px;
            font-size: 0.78em;
            font-weight: 600;
            opacity: 0.9;
        }

        .back-button {
            flex: 0 0 auto;
            padding: 7px 10px;
            background: #eef2f6;
            color: #4a6a8a;
            border: 1px solid #c5d0dc;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.82em;
            font-weight: 600;
            white-space: nowrap;
        }

        .back-button:active {
            background: #e2e8f0;
        }

        .profile-section {
            margin-bottom: 18px;
            text-align: left;
        }

        .profile-section h3 {
            color: #64748b;
            margin-bottom: 8px;
            font-size: 0.72em;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .day-note {
            margin: -6px 0 16px;
            color: #64748b;
            font-size: 0.82em;
            font-weight: 600;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Spelling OCR</h1>
            <a href="index.html" class="back-button">← Back</a>
        </div>
        <p class="day-note" id="dayNote">Today</p>

        <div class="profile-section">
            <h3>Profile AM</h3>
            <div class="game-selector">
                <a href="spelling_ocr_detail.html?profile=AM&game=EngSpellingOCR" class="game-button">English Spelling OCR<span class="game-count" data-profile="AM" data-game="EngSpellingOCR">…</span></a>
                <a href="spelling_ocr_detail.html?profile=AM&game=FrSpellingOCR" class="game-button">French Spelling OCR<span class="game-count" data-profile="AM" data-game="FrSpellingOCR">…</span></a>
            </div>
        </div>

        <div class="profile-section">
            <h3>Profile BM</h3>
            <div class="game-selector">
                <a href="spelling_ocr_detail.html?profile=BM&game=EngSpellingOCR" class="game-button">English Spelling OCR<span class="game-count" data-profile="BM" data-game="EngSpellingOCR">…</span></a>
                <a href="spelling_ocr_detail.html?profile=BM&game=FrSpellingOCR" class="game-button">French Spelling OCR<span class="game-count" data-profile="BM" data-game="FrSpellingOCR">…</span></a>
            </div>
        </div>

        <div class="profile-section">
            <h3>Profile TE</h3>
            <div class="game-selector">
                <a href="spelling_ocr_detail.html?profile=TE&game=EngSpellingOCR" class="game-button">English Spelling OCR<span class="game-count" data-profile="TE" data-game="EngSpellingOCR">…</span></a>
                <a href="spelling_ocr_detail.html?profile=TE&game=FrSpellingOCR" class="game-button">French Spelling OCR<span class="game-count" data-profile="TE" data-game="FrSpellingOCR">…</span></a>
            </div>
        </div>
    </div>
    <script>
        function photoKind(status) {
            const value = String(status || '');
            if (value === '✓' || value === 'checkmark' || value.toLowerCase() === 'correct') return 'correct';
            if (value.toLowerCase() === 'unverified') return 'unverified';
            return 'incorrect';
        }

        function torontoTodayYmd() {
            return new Intl.DateTimeFormat('en-CA', {
                timeZone: 'America/Toronto',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).format(new Date());
        }

        function addTorontoDays(ymd, deltaDays) {
            const parts = ymd.split('-').map(Number);
            const base = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2], 17, 0, 0));
            base.setUTCDate(base.getUTCDate() + deltaDays);
            return new Intl.DateTimeFormat('en-CA', {
                timeZone: 'America/Toronto',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).format(base);
        }

        function formatTorontoLong(ymd) {
            const parts = ymd.split('-').map(Number);
            const ms = Date.UTC(parts[0], parts[1] - 1, parts[2], 17, 0, 0);
            return new Date(ms).toLocaleDateString('en-US', {
                timeZone: 'America/Toronto',
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function missedList(value) {
            if (!value) return null;
            if (typeof value === 'string') {
                try { value = JSON.parse(value); } catch (e) { return null; }
            }
            if (!Array.isArray(value)) return null;
            const seen = {};
            const out = [];
            value.forEach((item) => {
                const word = String(item || '').trim();
                const key = word.toLowerCase();
                if (!word || seen[key]) return;
                seen[key] = true;
                out.push(word);
            });
            return out;
        }

        // Paper list and extra paper sheet store every word in the task, separated by |.
        function sheetWordList(task) {
            const parts = String(task || '').trim().split('-');
            if (parts.length < 5) return [];
            const gp = (parts[0] || '').toLowerCase();
            const isCopy = gp === 'engspellingocrxtra' || gp === 'frspellingocrxtra'
                || gp === 'engspellingcopy' || gp === 'frspellingcopy';
            const isList = gp === 'engspellingocrpaper' || gp === 'frspellingocrpaper';
            if (!isCopy && !isList) return [];
            let index = 1;
            if (/^\d{4}$/.test(parts[1]) && /^\d{2}$/.test(parts[2]) && /^\d{2}$/.test(parts[3])) index = 4;
            let raw = '';
            if (isCopy) {
                if (!/^r\d+$/i.test(parts[index] || '')) return [];
                if (!/^sheet$/i.test(parts[index + 1] || '')) return [];
                raw = parts.slice(index + 2, -1).join('-');
            } else {
                raw = parts.slice(index, -1).join('-');
            }
            return raw.split('|').map((item) => item.trim()).filter(Boolean);
        }

        function tallyTask(counts, task, status, missedWords) {
            const kind = status || photoKind(String(task || '').trim().split('-').pop());
            const words = sheetWordList(task);
            const missed = missedList(missedWords);
            if (kind === 'unverified') {
                counts.unverified += 1;
                return;
            }
            if (words.length && kind === 'correct') {
                counts.correct += words.length;
                return;
            }
            if (words.length && kind === 'incorrect' && missed && missed.length) {
                const incorrectN = Math.min(missed.length, words.length);
                counts.incorrect += incorrectN;
                counts.correct += Math.max(0, words.length - incorrectN);
                return;
            }
            if (kind === 'correct') counts.correct += 1;
            else counts.incorrect += 1;
        }

        function countTasks(tasks) {
            const counts = { correct: 0, incorrect: 0, unverified: 0 };
            (tasks || []).forEach((row) => tallyTask(counts, row.task, null, row.missed_words));
            return counts;
        }

        const typingLoads = {};

        function loadTyping(supabaseUrl, supabaseKey, profile, ymd) {
            const cacheKey = profile + ':' + ymd;
            if (!typingLoads[cacheKey]) {
                typingLoads[cacheKey] = fetch(`${supabaseUrl}/rest/v1/rpc/af_get_spelling_typing`, {
                    method: 'POST',
                    headers: {
                        'apikey': supabaseKey,
                        'Authorization': `Bearer ${supabaseKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ p_profile: profile, p_date: ymd })
                }).then(async (response) => {
                    if (!response.ok) return {};
                    const body = await response.json();
                    return body && typeof body === 'object' ? body : {};
                }).catch((error) => {
                    console.warn('Typing scores unavailable', profile, error);
                    return {};
                });
            }
            return typingLoads[cacheKey];
        }

        function typingCounts(attempts) {
            const counts = { correct: 0, incorrect: 0 };
            (attempts || []).forEach((item) => {
                if (!item || item.practice === true || item.practice === 'true' || item.extra === true || item.extra === 'true') return;
                if (item.correct === true || item.correct === 'true') counts.correct += 1;
                else counts.incorrect += 1;
            });
            return counts;
        }

        async function loadGameCounts() {
            const supabaseUrl = localStorage.getItem('supabaseUrl');
            const supabaseKey = localStorage.getItem('supabaseKey');
            const slots = document.querySelectorAll('.game-count');
            const ymd = torontoTodayYmd();
            document.getElementById('dayNote').textContent = `Today · ${formatTorontoLong(ymd)}`;
            document.querySelectorAll('a.game-button').forEach((link) => {
                const url = new URL(link.getAttribute('href'), window.location.href);
                url.searchParams.set('ymd', ymd);
                link.href = `spelling_ocr_detail.html?${url.searchParams.toString()}`;
            });
            if (!supabaseUrl || !supabaseKey) {
                slots.forEach((el) => { el.textContent = 'Set Supabase on the main page'; });
                return;
            }
            const headers = {
                'apikey': supabaseKey,
                'Authorization': `Bearer ${supabaseKey}`
            };
            await Promise.all([...slots].map(async (el) => {
                const profile = el.dataset.profile;
                const game = el.dataset.game;
                    const prefixes = [game];
                    if (game.endsWith('SpellingOCR')) {
                        prefixes.push(game.replace(/OCR$/, 'OCRXtra'));
                        prefixes.push(game.replace(/OCR$/, 'OCRPaper'));
                    }
                try {
                    const batches = await Promise.all(prefixes.map(async (prefix) => {
                        const pattern = encodeURIComponent(`${prefix}-${ymd}-`) + '%25';
                        const response = await fetch(
                            `${supabaseUrl}/rest/v1/image_uploads?profile=eq.${profile}&task=ilike.${pattern}&select=task,missed_words`,
                            { headers }
                        );
                        if (!response.ok) throw new Error(await response.text());
                        const dated = await response.json();
                        const legacyAny = encodeURIComponent(`${prefix}-`) + '%25';
                        const legacyDated = encodeURIComponent(`${prefix}-____-__-__-`) + '%25';
                        const start = encodeURIComponent(`${ymd}T00:00:00`);
                        const end = encodeURIComponent(`${addTorontoDays(ymd, 1)}T00:00:00`);
                        const legacyResponse = await fetch(
                            `${supabaseUrl}/rest/v1/image_uploads?profile=eq.${profile}&task=ilike.${legacyAny}&task=not.ilike.${legacyDated}&capture_date_time=gte.${start}&capture_date_time=lt.${end}&select=task,missed_words`,
                            { headers }
                        );
                        const legacy = legacyResponse.ok ? await legacyResponse.json() : [];
                        return dated.concat(legacy);
                    }));
                    const counts = countTasks(batches.flat());
                    const total = counts.correct + counts.incorrect + counts.unverified;
                    const unverifiedNote = counts.unverified ? `, ${counts.unverified} unverified` : '';
                    if (total) {
                        el.textContent = `${counts.correct} correct, ${counts.incorrect} incorrect${unverifiedNote}`;
                        return;
                    }
                    const typing = await loadTyping(supabaseUrl, supabaseKey, profile, ymd);
                    const lang = game.startsWith('Fr') ? 'fr' : 'eng';
                    const attempts = Array.isArray(typing[lang]) ? typing[lang] : [];
                    if (!attempts.length) {
                        el.textContent = 'Nothing today';
                        return;
                    }
                    const typed = typingCounts(attempts);
                    el.textContent = `${typed.correct} correct, ${typed.incorrect} incorrect · keyboard`;
                } catch (error) {
                    console.error('OCR count failed', profile, game, error);
                    el.textContent = 'Could not load counts';
                }
            }));
        }

        loadGameCounts();
    </script>
</body>
</html>
