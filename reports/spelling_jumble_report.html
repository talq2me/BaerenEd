<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard spelling</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(160deg, #5a7a9c 0%, #4a6a8a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.2);
            padding: 16px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
            text-align: left;
        }
        .page-header h1 { color: #222; margin: 0; font-size: 1.15em; font-weight: 700; }
        .back-button {
            flex: 0 0 auto;
            padding: 7px 10px;
            background: #eef2f6;
            color: #4a6a8a;
            border: 1px solid #c5d0dc;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.82em;
            font-weight: 600;
            white-space: nowrap;
        }
        .day-note, .hint {
            color: #64748b;
            font-size: 0.82em;
            font-weight: 600;
            text-align: left;
        }
        .day-note { margin: 0 0 6px; }
        .hint { margin: 0 0 16px; font-weight: 500; }
        .profile-section { margin-bottom: 18px; text-align: left; }
        .profile-section h3 {
            color: #64748b;
            margin-bottom: 8px;
            font-size: 0.72em;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .game-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .game-button {
            background: #5a7a9c;
            color: white;
            border: none;
            padding: 14px 10px;
            border-radius: 11px;
            font-size: 0.92em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 48px;
        }
        .game-count {
            display: block;
            margin-top: 4px;
            font-size: 0.78em;
            font-weight: 600;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Keyboard spelling</h1>
            <a href="index.html" class="back-button">← Back</a>
        </div>
        <p class="day-note" id="dayNote">Today</p>
        <p class="hint">First try for each word. A miss is rewritten three times in the game.</p>
        <div class="profile-section">
            <h3>Profile AM</h3>
            <div class="game-selector">
                <a href="spelling_jumble_detail.html?profile=AM&amp;lang=eng" class="game-button">English<span class="game-count" data-profile="AM" data-lang="eng">…</span></a>
                <a href="spelling_jumble_detail.html?profile=AM&amp;lang=fr" class="game-button">French<span class="game-count" data-profile="AM" data-lang="fr">…</span></a>
            </div>
        </div>
        <div class="profile-section">
            <h3>Profile BM</h3>
            <div class="game-selector">
                <a href="spelling_jumble_detail.html?profile=BM&amp;lang=eng" class="game-button">English<span class="game-count" data-profile="BM" data-lang="eng">…</span></a>
                <a href="spelling_jumble_detail.html?profile=BM&amp;lang=fr" class="game-button">French<span class="game-count" data-profile="BM" data-lang="fr">…</span></a>
            </div>
        </div>
        <div class="profile-section">
            <h3>Profile TE</h3>
            <div class="game-selector">
                <a href="spelling_jumble_detail.html?profile=TE&amp;lang=eng" class="game-button">English<span class="game-count" data-profile="TE" data-lang="eng">…</span></a>
                <a href="spelling_jumble_detail.html?profile=TE&amp;lang=fr" class="game-button">French<span class="game-count" data-profile="TE" data-lang="fr">…</span></a>
            </div>
        </div>
    </div>
    <script>
        function torontoTodayYmd() {
            return new Intl.DateTimeFormat('en-CA', {
                timeZone: 'America/Toronto',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).format(new Date());
        }

        function formatTorontoLong(ymd) {
            const parts = ymd.split('-').map(Number);
            return new Date(Date.UTC(parts[0], parts[1] - 1, parts[2], 17, 0, 0)).toLocaleDateString('en-US', {
                timeZone: 'America/Toronto',
                weekday: 'long',
                month: 'long',
                day: 'numeric'
            });
        }

        function firstTries(attempts) {
            return (attempts || []).filter((item) => item && item.practice !== true && item.practice !== 'true' && item.extra !== true && item.extra !== 'true');
        }

        async function loadCounts() {
            const supabaseUrl = localStorage.getItem('supabaseUrl');
            const supabaseKey = localStorage.getItem('supabaseKey');
            const ymd = torontoTodayYmd();
            document.getElementById('dayNote').textContent = `Today · ${formatTorontoLong(ymd)}`;
            document.querySelectorAll('a.game-button').forEach((link) => {
                const url = new URL(link.getAttribute('href'), window.location.href);
                url.searchParams.set('ymd', ymd);
                link.href = `spelling_jumble_detail.html?${url.searchParams.toString()}`;
            });
            const slots = document.querySelectorAll('.game-count');
            if (!supabaseUrl || !supabaseKey) {
                slots.forEach((el) => { el.textContent = 'Set Supabase on the main page'; });
                return;
            }
            const headers = {
                apikey: supabaseKey,
                Authorization: `Bearer ${supabaseKey}`,
                'Content-Type': 'application/json'
            };
            const byProfile = {};
            await Promise.all([...new Set([...slots].map((el) => el.dataset.profile))].map(async (profile) => {
                try {
                    const response = await fetch(`${supabaseUrl}/rest/v1/rpc/af_get_spelling_typing`, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify({ p_profile: profile, p_date: ymd })
                    });
                    byProfile[profile] = response.ok ? await response.json() : {};
                } catch (error) {
                    console.warn(error);
                    byProfile[profile] = null;
                }
            }));
            slots.forEach((el) => {
                const data = byProfile[el.dataset.profile];
                if (!data) {
                    el.textContent = 'Could not load';
                    return;
                }
                const tries = firstTries(data[el.dataset.lang]);
                if (!tries.length) {
                    el.textContent = 'Nothing today';
                    return;
                }
                const correct = tries.filter((item) => item.correct === true || item.correct === 'true').length;
                el.textContent = `${correct} correct, ${tries.length - correct} incorrect`;
            });
        }

        loadCounts();
    </script>
</body>
</html>
